[package]
name = "respected-orchestrator-desktop"
version = "0.1.0-beta.4"
edition = "2021"
description = "Respected Orchestrator desktop workbench"
authors = ["RESPECTED"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
sha2 = "0.10"
getrandom = "0.3"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }

[lib]
name = "respected_orchestrator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }
