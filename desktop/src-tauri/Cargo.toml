[package]
name = "respected-orchestrator-desktop"
version = "0.1.0-beta.3"
edition = "2021"
description = "Respected Orchestrator desktop workbench"
authors = ["RESPECTED"]
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom = "0.3"

[lib]
name = "respected_orchestrator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
