[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "respected-orchestrator"
version = "0.1.0-beta.2"
description = "Independent local AI task orchestration engine"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "RESPECTED" }]
requires-python = ">=3.10"
dependencies = [
    "agent-framework-core==1.21.0",
]

[project.urls]
Repository = "https://github.com/respected0/respected-orchestrator"

[project.optional-dependencies]
dev = ["pyinstaller>=6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
respected_orchestrator = ["resources/skills/*/SKILL.md"]
