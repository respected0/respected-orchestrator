name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    # Windows only for now: the acceptance sandbox, process-tree control and worker shims are Windows code paths.
    name: tests (windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install package and build tools
        run: python -m pip install -e ".[dev]"
      - name: Build the packaged engine
        run: python packaging/build_dist.py --output dist
      - name: Security matrix (standard user, zero skips)
        # Hosted runners are elevated and the AppContainer boundary refuses that, so the whole security set runs as a
        # throw-away standard local user (ADR-017). It fails on any skip, error, elevation or missing test.
        run: powershell -NoProfile -File tests/tools/run_security_as_user.ps1
      - name: Security gate (manifest for this commit)
        run: python tests/tools/run_security_ci.py verify security-manifest.json
      - name: Unit, integration, adversarial and packaged-build tests
        # tests/packaging runs the built exe with no Python on PATH and is required here (CI is set). Security tests are NOT
        # in the skip list; the elevated hosted runner skips only the general sandbox-dependent ids (the aim is an empty list).
        env:
          ORCH_ALLOW_ELEVATED_SKIP: "1"
        run: python tests/tools/run_ci.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: orchestrator-windows
          path: dist/RespectedOrchestrator
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: security-manifest
          path: |
            security-manifest.json
            security-run.log.stdout
            security-run.log.stderr
          if-no-files-found: error
