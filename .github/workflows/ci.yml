name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    # Windows only for now: the acceptance sandbox, process-tree control and worker shims are Windows code paths.
    name: tests (windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package and build tools
        run: python -m pip install -e ".[dev]"
      - name: Build the packaged engine
        run: python tools/build_dist.py --output dist
      - name: Unit, integration, adversarial and packaged-build tests
        # tests/packaging runs the built exe with no Python on PATH and is required here (CI is set)
        run: python -m unittest discover -s tests -t .
      - uses: actions/upload-artifact@v4
        with:
          name: orchestrator-windows
          path: dist/RespectedOrchestrator
          if-no-files-found: error
