name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  test:
    # Windows only for now: the acceptance sandbox, process-tree control and worker shims are Windows code paths.
    name: tests (windows, Python 3.13)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install package
        run: python -m pip install -e .
      - name: Repository atlas
        run: python tools/repository_map.py --check
      - name: Unit, integration and adversarial tests
        run: python -m unittest discover -s tests -t .
