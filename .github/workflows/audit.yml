name: audit

# Weekly dependency advisory check; kept apart from ci.yml so a new advisory does not turn every push red.
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: advisories (pip-audit)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.13"
      - name: Install package, build tools and pip-audit
        run: python -m pip install -e ".[dev]" pip-audit
      - name: Python advisories
        run: pip-audit --local --skip-editable
