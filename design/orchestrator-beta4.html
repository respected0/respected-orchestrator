<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Respected Orchestrator — Beta.4 tasarım prototipi</title>
<style>
:root{
  --bg:#faf9f5;--panel:#f4f2eb;--side:#f0eee6;--raise:#ffffff;--hover:#e9e6dc;--line:#e4e1d6;--line2:#d6d2c4;
  --tx:#1f1e1b;--tx2:#6b6859;--tx3:#9a9684;
  --acc:#b4532f;--acc-bg:#f6e6dd;--ok:#3f7a52;--ok-bg:#e3efe6;--warn:#9a6a14;--warn-bg:#f6ecd2;--err:#b23b34;--err-bg:#f6e0dd;--info:#3b6a94;--info-bg:#e1ebf4;
  --add:#e3efe6;--del:#f6e0dd;--code:#f1efe7;--shadow:0 8px 30px rgba(40,30,10,.12);
  --mono:"Cascadia Code","JetBrains Mono",Consolas,monospace;--sans:"Segoe UI Variable Text","Segoe UI",Inter,system-ui,sans-serif;
}
:root[data-theme=dark]{
  --bg:#1f1e1c;--panel:#252421;--side:#181715;--raise:#2b2a26;--hover:#33312c;--line:#34322d;--line2:#46433b;
  --tx:#ece9e0;--tx2:#a39f91;--tx3:#78756a;
  --acc:#d9774f;--acc-bg:#3a2a21;--ok:#7fc093;--ok-bg:#1f2f25;--warn:#d9a948;--warn-bg:#352c16;--err:#e07b72;--err-bg:#3a2321;--info:#7fb0dc;--info-bg:#1f2c3a;
  --add:#1f3026;--del:#3a2321;--code:#262521;--shadow:0 8px 30px rgba(0,0,0,.45);
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font:13.5px/1.5 var(--sans);background:var(--bg);color:var(--tx);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;border-radius:6px}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.mono{font-family:var(--mono);font-size:12px}
.mut{color:var(--tx2)}.mut3{color:var(--tx3)}
.row{display:flex;align-items:center;gap:8px}.col{display:flex;flex-direction:column}.grow{flex:1;min-width:0}.sp{flex:1}
.title{height:36px;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--side);border-bottom:1px solid var(--line);font-size:12px;color:var(--tx2)}
.title b{color:var(--tx);font-weight:600}
.title select,.seg{background:var(--raise);border:1px solid var(--line);border-radius:6px;color:var(--tx);font-size:12px;padding:2px 6px}
.app{display:grid;height:calc(100% - 36px);grid-template-columns:var(--sw,252px) 1fr var(--rw,0px)}
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;padding:10px 8px;gap:2px;overflow:auto}
.nav{display:flex;align-items:center;gap:9px;padding:6px 9px;border-radius:7px;color:var(--tx);text-align:left;width:100%}
.nav:hover{background:var(--hover)}.nav.on{background:var(--hover);font-weight:600}
.nav svg{width:16px;height:16px;flex:none;stroke:var(--tx2)}
.nav .badge{margin-left:auto}
.lab{font-size:11px;letter-spacing:.04em;color:var(--tx3);padding:12px 9px 4px;text-transform:uppercase}
.sub{padding-left:30px;color:var(--tx2);font-size:13px}.sub.on{color:var(--tx);background:var(--hover)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--tx3)}
.dot.run{background:var(--info)}.dot.ok{background:var(--ok)}.dot.err{background:var(--err)}.dot.warn{background:var(--warn)}
.badge{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--hover);color:var(--tx2);white-space:nowrap}
.badge.ok{background:var(--ok-bg);color:var(--ok)}.badge.warn{background:var(--warn-bg);color:var(--warn)}.badge.err{background:var(--err-bg);color:var(--err)}.badge.info{background:var(--info-bg);color:var(--info)}.badge.acc{background:var(--acc-bg);color:var(--acc)}
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.bar{height:44px;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);flex:none}
.bar h1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:30px;height:30px;display:grid;place-items:center;color:var(--tx2)}.ib:hover{background:var(--hover);color:var(--tx)}.ib.on{background:var(--hover);color:var(--tx)}
.ib svg,.btn svg{width:16px;height:16px;stroke:currentColor}
svg{fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;width:16px;height:16px;flex:none;stroke:currentColor}
.hero h1{margin:0}
@media (max-width:980px){.app{--sw:56px}.side .nav span,.side .lab,.side .badge,.side .row,.side .sub{display:none}.side .nav{justify-content:center}}
.btn{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border:1px solid var(--line2);background:var(--raise);border-radius:7px}
.btn:hover{background:var(--hover)}.btn.pri{background:var(--tx);color:var(--bg);border-color:var(--tx)}.btn.acc{background:var(--acc);color:#fff;border-color:var(--acc)}
.btn.sm{padding:2px 8px;font-size:12px}.btn.err{color:var(--err)}
.toggle{display:flex;background:var(--hover);border-radius:8px;padding:2px}
.toggle button{padding:3px 12px;border-radius:6px;font-size:12.5px;color:var(--tx2)}.toggle button.on{background:var(--raise);color:var(--tx);box-shadow:0 1px 2px rgba(0,0,0,.1)}
.scroll{overflow:auto;min-height:0;flex:1}
.wrap{max-width:780px;margin:0 auto;padding:22px 24px 12px}
.msg{margin:0 0 22px}
.msg.user{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-left:56px}
.who{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);margin-bottom:5px}
.av{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--acc-bg);color:var(--acc)}
.card{border:1px solid var(--line);background:var(--raise);border-radius:10px;margin:8px 0;overflow:hidden}
.card>.h{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font-weight:600;font-size:12.5px}
.card>.h:last-child{border:0}.card .b{padding:10px 12px}
.card.click{cursor:pointer}.card.click:hover{border-color:var(--line2)}
.step{display:flex;gap:9px;align-items:flex-start;padding:5px 0}
.ic{width:16px;height:16px;border-radius:50%;flex:none;margin-top:2px;display:grid;place-items:center;font-size:10px;border:1.5px solid var(--line2);color:#fff}
.ic.ok{background:var(--ok);border-color:var(--ok)}.ic.run{border-color:var(--info);border-top-color:transparent;animation:sp 1s linear infinite}.ic.err{background:var(--err);border-color:var(--err)}.ic.warn{background:var(--warn);border-color:var(--warn)}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.ic.run{animation:none}}
.tool{display:flex;align-items:center;gap:8px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;margin:4px 0;color:var(--tx2);font-size:12.5px;background:var(--panel)}
.tool .mono{color:var(--tx)}
.route{background:var(--info-bg);color:var(--info);border-radius:8px;padding:7px 11px;font-size:12.5px;display:flex;gap:8px;align-items:center;margin:6px 0}
.comp{padding:0 24px 14px}
.compbox{max-width:780px;margin:0 auto;border:1px solid var(--line2);background:var(--raise);border-radius:14px;box-shadow:0 2px 10px rgba(0,0,0,.05);padding:10px 12px 8px}
.compbox textarea{width:100%;border:0;background:none;color:var(--tx);resize:none;font:inherit;outline:0;min-height:44px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border:1px solid var(--line);border-radius:99px;font-size:12px;color:var(--tx2);background:var(--panel)}
.chip:hover{background:var(--hover)}
.tray{display:flex;gap:6px;margin-bottom:6px;flex-wrap:wrap}
.pop{position:absolute;z-index:20;background:var(--raise);border:1px solid var(--line2);border-radius:12px;box-shadow:var(--shadow);padding:6px;min-width:260px}
.pop .it{display:flex;gap:9px;padding:7px 9px;border-radius:8px;width:100%;text-align:left;align-items:flex-start}
.pop .it:hover,.pop .it.on{background:var(--hover)}
.pop hr{border:0;border-top:1px solid var(--line);margin:5px 0}
.right{background:var(--bg);border-left:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;position:relative}
.right .bar{height:44px}
.sec{padding:12px 14px;border-bottom:1px solid var(--line)}
.sec h3{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--tx3);margin-bottom:8px;font-weight:600}
.meter{height:6px;background:var(--hover);border-radius:9px;overflow:hidden;display:flex}
.meter i{display:block;height:100%}
.kv{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.tabs{display:flex;gap:2px;padding:0 12px;border-bottom:1px solid var(--line);flex:none}
.tabs button{padding:9px 10px;color:var(--tx2);border-radius:0;border-bottom:2px solid transparent}.tabs button.on{color:var(--tx);border-color:var(--acc)}
.resizer{position:absolute;left:-3px;top:0;bottom:0;width:6px;cursor:col-resize;z-index:5}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--raise)}
.diff div{padding:0 10px;white-space:pre;min-height:18px}.diff .a{background:var(--add)}.diff .d{background:var(--del)}.diff .h{background:var(--panel);color:var(--tx2);padding:4px 10px}
.term{background:var(--code);border:1px solid var(--line);border-radius:8px;font-family:var(--mono);font-size:12px;padding:10px 12px;overflow:auto;line-height:1.55}
.term .p{color:var(--acc)}.term .o{color:var(--ok)}.term .e{color:var(--err)}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--tx3);text-align:left;font-weight:600;padding:6px 10px;border-bottom:1px solid var(--line)}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr.click:hover td{background:var(--panel);cursor:pointer}
.page{padding:22px 28px;max-width:1040px;margin:0 auto;width:100%}
.page h2{font-size:18px;font-weight:600;margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.kanban{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.kanban .colh{font-size:12px;color:var(--tx2);padding:4px 2px;display:flex;gap:6px}
.tcard{border:1px solid var(--line);background:var(--raise);border-radius:9px;padding:9px 11px;margin-bottom:8px;cursor:pointer}.tcard:hover{border-color:var(--line2)}
.sw{width:32px;height:18px;border-radius:99px;background:var(--line2);position:relative;flex:none}.sw::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.15s}.sw.on{background:var(--ok)}.sw.on::after{left:16px}
.modalbg{position:fixed;inset:0;background:rgba(20,15,5,.38);display:grid;place-items:center;z-index:50}
.modal{background:var(--raise);border:1px solid var(--line2);border-radius:14px;box-shadow:var(--shadow);width:min(560px,92vw);max-height:88vh;overflow:auto}
.modal .mh{padding:14px 18px;border-bottom:1px solid var(--line);font-weight:600;display:flex;gap:8px;align-items:center}
.modal .mb{padding:14px 18px}.modal .mf{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.toast{position:fixed;right:18px;bottom:18px;background:var(--tx);color:var(--bg);padding:9px 14px;border-radius:9px;z-index:60;box-shadow:var(--shadow);max-width:360px}
.strip{display:flex;gap:10px;align-items:center;padding:8px 24px;border-bottom:1px solid var(--line);background:var(--panel);font-size:12.5px}
.graphwrap{flex:1;min-height:0;overflow:auto;background:radial-gradient(var(--line) 1px,transparent 1px) 0 0/18px 18px}
.node{cursor:pointer}.node rect{fill:var(--raise);stroke:var(--line2);stroke-width:1.2}.node:hover rect,.node.sel rect{stroke:var(--acc);stroke-width:2}
.node text{fill:var(--tx);font-size:12.5px;font-family:var(--sans)}.node .s{fill:var(--tx2);font-size:11px}
.edge{stroke:var(--line2);stroke-width:1.5;fill:none}.edge.live{stroke:var(--info);stroke-dasharray:5 4}
.dock{border-top:1px solid var(--line);height:170px;display:flex;flex-direction:column;flex:none}
.ftree{width:210px;border-right:1px solid var(--line);padding:10px 8px;overflow:auto;flex:none;background:var(--panel)}
.ftree .nav{padding:3px 7px;font-size:12.5px}
.note{font-size:11.5px;color:var(--tx3);padding:6px 24px;border-top:1px solid var(--line);text-align:center}
.empty{text-align:center;padding:60px 20px;color:var(--tx2)}
.hero{display:flex;flex-direction:column;justify-content:center;align-items:center;flex:1;gap:18px;padding:0 24px 8vh}
.hero h1{font-size:26px;font-weight:500;letter-spacing:-.01em}
@media (max-width:1100px){.side{--sw:200px}}
</style>
</head>
<body>
<div class="title">
  <b>Respected Orchestrator</b><span>Beta.4 · tasarım prototipi · konsept veri</span>
  <span class="sp"></span>
  <label>Yerleşim <select id="layoutSel" aria-label="Yerleşim alternatifi">
    <option value="A">A · Minimal</option><option value="B">B · Çalışma alanı</option><option value="C">C · Sakin orkestrasyon</option></select></label>
  <label>An <select id="phaseSel" aria-label="Senaryo zamanı">
    <option value="run">06:42 · Builder çalışıyor</option><option value="approve">07:05 · İzin bekliyor</option><option value="review">09:10 · İnceleme hazır</option><option value="fail">Alternatif · QA başarısız</option></select></label>
  <button class="seg" id="themeBtn" aria-label="Tema değiştir">Açık / Koyu</button>
</div>
<div class="app" id="app"></div>
<div id="layer"></div>

<script>
const I=(d)=>`<svg viewBox="0 0 24 24">${d}</svg>`;
const ic={
 plus:I('<path d="M12 5v14M5 12h14"/>'),search:I('<circle cx="11" cy="11" r="6"/><path d="m20 20-4-4"/>'),folder:I('<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>'),
 inbox:I('<path d="M4 13l2-8h12l2 8M4 13v5h16v-5M4 13h5a3 3 0 0 0 6 0h5"/>'),gear:I('<circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>'),
 chat:I('<path d="M5 6h14v10H10l-4 3v-3H5z"/>'),graph:I('<circle cx="6" cy="6" r="2"/><circle cx="18" cy="6" r="2"/><circle cx="12" cy="18" r="2"/><path d="M8 6h8M7 8l4 8M17 8l-4 8"/>'),
 panel:I('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/>'),mic:I('<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>'),
 shot:I('<path d="M4 8V5h3M17 5h3v3M20 16v3h-3M7 19H4v-3"/><rect x="9" y="9" width="6" height="6" rx="1"/>'),clip:I('<path d="M20 11l-8 8a5 5 0 0 1-7-7l8-8a3.5 3.5 0 0 1 5 5l-8 8a2 2 0 0 1-3-3l7-7"/>'),
 ctx:I('<circle cx="12" cy="12" r="8"/><path d="M12 4a8 8 0 0 1 0 16"/>'),tools:I('<path d="M14 6l4 4-8 8H6v-4zM13 7l4 4"/>'),send:I('<path d="M5 12l14-7-5 14-2-6z"/>'),
 term:I('<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m7 10 3 2-3 2M12 15h5"/>'),file:I('<path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4"/>'),
 check:I('<path d="m5 12 5 5 9-10"/>'),shield:I('<path d="M12 3l7 3v6c0 4-3 7-7 9-4-2-7-5-7-9V6z"/>'),more:I('<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>'),
 x:I('<path d="M6 6l12 12M18 6 6 18"/>'),down:I('<path d="m6 9 6 6 6-6"/>'),list:I('<path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/>'),users:I('<circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M16 5a3 3 0 0 1 0 6M18 14a5 5 0 0 1 3 6"/>'),
 chart:I('<path d="M4 20V4M4 20h16M8 16v-5M13 16V8M18 16v-9"/>'),back:I('<path d="M15 6l-6 6 6 6"/>'),
};
const S={view:'chat',project:'tavarluk',mode:'chat',panel:null,agent:'builder',layout:'A',phase:'run',theme:null,pop:null,rw:360,drafts:[],teamTab:'agents'};
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

/* ---- scenario data (concept, tutarlı) ---- */
const AG={
 planner:{n:'Planner',m:'Claude Code',mo:'Opus 5.5',av:'P'},builder:{n:'Builder',m:'Codex',mo:'GPT-5.x',av:'B'},
 reviewer:{n:'Reviewer',m:'Claude Code',mo:'Sonnet 5.5',av:'R'},qa:{n:'QA',m:'Uyumlu CLI ajanı',mo:'Yerel adaptör',av:'Q'}};
function st(){ // her faz için ajan durumları
 const p=S.phase;
 if(p==='run')return{planner:'ok',builder:'run',qa:'ok',reviewer:'wait',gate:'wait',t:'06:42'};
 if(p==='approve')return{planner:'ok',builder:'warn',qa:'ok',reviewer:'wait',gate:'wait',t:'07:05'};
 if(p==='review')return{planner:'ok',builder:'ok',qa:'ok',reviewer:'ok',gate:'warn',t:'09:10'};
 return{planner:'ok',builder:'ok',qa:'err',reviewer:'wait',gate:'wait',t:'08:21'};
}
const stTxt={ok:'Tamamlandı',run:'Çalışıyor',wait:'Sırada',warn:'İzin bekliyor',err:'Başarısız'};
const stBadge={ok:'ok',run:'info',wait:'',warn:'warn',err:'err'};
const sb=(k,t)=>`<span class="badge ${stBadge[k]}"><span class="dot ${k==='wait'?'':k}"></span> ${t||stTxt[k]}</span>`;
const stepIc=k=>`<span class="ic ${k==='wait'?'':k}">${k==='ok'?'✓':k==='err'?'!':k==='warn'?'?':''}</span>`;

/* ---- shell ---- */
function render(){
  document.documentElement.dataset.theme=S.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');
  const showRight=!!S.panel&&['chat','orch'].includes(S.view==='chat'?'chat':S.view);
  $('#app').style.setProperty('--rw',showRight?S.rw+'px':'0px');
  $('#app').innerHTML=sidebar()+`<main class="main" id="main">${mainView()}</main>`+(showRight?`<aside class="right" aria-label="Bağlam paneli"><div class="resizer" id="rz"></div>${rightPanel()}</aside>`:'<aside></aside>');
  $('#layoutSel').value=S.layout;$('#phaseSel').value=S.phase;
  bind(); drawPop();
}
function sidebar(){
  const v=S.view;
  const n=(id,i,t,x='')=>`<button class="nav ${v===id?'on':''}" data-go="${id}">${ic[i]}<span>${t}</span>${x}</button>`;
  const pend=S.phase==='approve'||S.phase==='review'||S.phase==='fail';
  return `<nav class="side" aria-label="Ana gezinme">
   <button class="nav" data-go="home" style="font-weight:600">${ic.plus}<span>Yeni sohbet</span></button>
   <button class="nav" id="cmdk">${ic.search}<span>Ara</span><span class="badge">Ctrl K</span></button>
   ${n('inbox','inbox','Gelen kutusu',pend?`<span class="badge ${S.phase==='fail'?'err':'warn'}">${S.phase==='fail'?'1 hata':'1 onay'}</span>`:'')}
   <div class="lab">Projeler</div>
   ${[['tavarluk','Kişisel finans uygulaması'],['respected-hub',''],['respected-brain',''],['respected-orchestrator','']].map(([p])=>`<button class="nav ${S.project===p&&['chat','orch','tasks','review','proj'].includes(v)?'on':''}" data-proj="${p}">${ic.folder}<span>${p}</span>${p==='tavarluk'&&S.phase==='run'?'<span class="dot run" title="Çalışıyor"></span>':''}</button>`).join('')}
   <button class="nav sub" data-go="projects">Tüm projeler ve çalışma alanları…</button>
   <div class="lab">Son konuşmalar · ${S.project}</div>
   <button class="nav sub ${v==='chat'||v==='orch'?'on':''}" data-go="chat"><span class="dot ${S.phase==='fail'?'err':S.phase==='review'?'ok':'run'}"></span> Ödeme senkronizasyonu</button>
   <button class="nav sub" data-toast="Örnek konuşma — bu prototipte içerik yok"><span class="dot ok"></span> Webhook retry mantığı</button>
   <button class="nav sub" data-toast="Örnek konuşma — bu prototipte içerik yok"><span class="dot"></span> Kategori eşleştirme refaktörü</button>
   <button class="nav sub" data-go="tasks">${ic.list.replace('<svg','<svg style="width:14px;height:14px"')} Görevler (12)</button>
   <div class="sp"></div>
   <button class="nav" data-go="team">${ic.users}<span>Ajanlar ve ekipler</span></button>

  $('#mbg').onclick=e=>{if(e.target.id==='mbg'||e.target.closest('[data-x]'))L.innerHTML='';};
  L.querySelectorAll('[data-mact]').forEach(b=>b.onclick=()=>{const[k,t]=b.dataset.mact.split('|');L.innerHTML='';
    if(k==='voice'&&t!=='İptal'){S.drafts.push('Sesli taslak');render();}
    else if(k==='shot'&&t!=='İptal'){S.drafts.push('Ekran görüntüsü');render();}
    else if(k==='task'){S.view='chat';S.mode='chat';render();}
    else toast(t==='Dala uygula'?'Prototip: gerçek uygulama yapılmaz':t+' (prototip)');});
  document.onkeydown=e=>{if(e.key==='Escape'){L.innerHTML='';S.pop=null;drawPop();}};
}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200);}

/* ---- events ---- */
function bind(){
  bindIn(document);
  const rz=$('#rz');
  if(rz)rz.onmousedown=e=>{e.preventDefault();const mv=ev=>{S.rw=Math.max(300,Math.min(640,innerWidth-ev.clientX));$('#app').style.setProperty('--rw',S.rw+'px')};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up)};addEventListener('mousemove',mv);addEventListener('mouseup',up)};
}
function bindIn(r){
  r.querySelectorAll('[data-go]').forEach(b=>b.onclick=e=>{e.preventDefault();const g=b.dataset.go;S.pop=null;S.view=g;if(g==='chat')S.mode='chat';if(g==='welcome'||g==='home')S.panel=null;render();});
  r.querySelectorAll('[data-proj]').forEach(b=>b.onclick=()=>{S.project=b.dataset.proj;S.view=b.dataset.proj==='tavarluk'?'chat':'home';S.mode='chat';S.pop=null;render();});
  r.querySelectorAll('[data-mode]').forEach(b=>b.onclick=e=>{e.preventDefault();S.mode=b.dataset.mode;S.view='chat';if(S.mode==='chat'&&S.panel==='agent')S.panel=null;render();});
  r.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const p=b.dataset.panel;S.panel=p&&S.panel===p?null:p||null;render();});
  r.querySelectorAll('[data-agent]').forEach(b=>b.onclick=()=>{S.agent=b.dataset.agent;S.panel='agent';S.pop=null;render();});
  r.querySelectorAll('[data-pop]').forEach(b=>b.onclick=e=>{e.preventDefault();e.stopPropagation();S.pop=S.pop===b.dataset.pop?null:b.dataset.pop;drawPop();});
  r.querySelectorAll('[data-modal]').forEach(b=>b.onclick=e=>{e.stopPropagation();S.pop=null;drawPop();modal(b.dataset.modal,b.dataset.id);});
  r.querySelectorAll('[data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast));
  r.querySelectorAll('[data-sw]').forEach(b=>b.onclick=e=>{e.stopPropagation();b.classList.toggle('on');});
  r.querySelectorAll('[data-otab]').forEach(b=>b.onclick=()=>{S.otab=b.dataset.otab;render();});
  r.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{S.teamTab=b.dataset.tt;render();});
  r.querySelectorAll('[data-rmd]').forEach(b=>b.onclick=()=>{S.drafts.splice(+b.dataset.rmd,1);render();});
  r.querySelectorAll('[data-send]').forEach(b=>b.onclick=()=>{const t=$('#ta');if(!t||!t.value.trim()){toast('Boş mesaj gönderilmez');return;}toast('Gönderildi (prototip — ajan yanıtı yok)');t.value='';});
  const c=$('#cmdk');if(c)c.onclick=()=>toast('Komut paleti (Ctrl K) — prototipte işlevsiz');
}
document.addEventListener('click',e=>{if(S.pop&&!e.target.closest('#pop,[data-pop]')){S.pop=null;drawPop();}});
$('#layoutSel').onchange=e=>{S.layout=e.target.value;render();};
$('#phaseSel').onchange=e=>{S.phase=e.target.value;if(S.phase==='fail'&&S.view==='review')S.view='chat';render();};
$('#themeBtn').onclick=()=>{const cur=document.documentElement.dataset.theme;S.theme=cur==='dark'?'light':'dark';render();};
S.view=new URLSearchParams(location.search).get('v')||'chat';
render();
</script>
</body>
</html>
